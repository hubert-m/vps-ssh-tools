port 1194
proto udp
dev tun
topology subnet
server 10.8.0.0 255.255.255.0
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
tls-version-min 1.2
ca /etc/openvpn/server/hm/pki/ca.crt
cert /etc/openvpn/server/hm/pki/issued/server.crt
key /etc/openvpn/server/hm/pki/private/server.key
tls-crypt /etc/openvpn/server/tls-crypt.key
auth SHA256
dh none
remote-cert-tls client
crl-verify /etc/openvpn/server/crl.pem
user nobody
group nogroup
persist-key
persist-tun
keepalive 10 120
client-config-dir /etc/openvpn/server/ccd
status /run/openvpn-server/status-hm.log 30
status-version 3
management /run/openvpn-server/hm.sock unix
verb 3
explicit-exit-notify 1
