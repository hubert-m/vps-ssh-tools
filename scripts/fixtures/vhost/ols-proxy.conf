docRoot                   /home/app.example.pl/public_html
vhDomain                  app.example.pl
vhAliases                 www.app.example.pl
index  {
  useServer               0
  indexFiles              index.html
}

tuning {
  maxReqBodySize          16777216
  maxDynRespSize          16777216
}

errorlog /home/app.example.pl/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/app.example.pl/logs/access.log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

context /.well-known/acme-challenge/ {
  location                /home/app.example.pl/public_html/.well-known/acme-challenge/
  allowBrowse             1
  rewrite  {
    enable                0
  }
  defaultCharset          off
}

context exp:^/\.(env|git) {
  allowBrowse             0
}

extprocessor node_app_example_pl {
  type                    proxy
  address                 127.0.0.1:3007
  maxConns                500
  pcKeepAliveTimeout      3600
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 node_app_example_pl
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
RequestHeader unset X-Forwarded-Proto
RequestHeader set X-Forwarded-Proto "http"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
RequestHeader set X-Real-IP "%{REMOTE_ADDR}e"
unset X-Powered-By
END_extraHeaders
}

module cache {
  storagePath /usr/local/lsws/cachedata/app.example.pl
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
}
