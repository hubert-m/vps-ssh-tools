docRoot                   /home/app.example.pl/public_html
vhDomain                  app.example.pl
vhAliases                 www.app.example.pl

errorlog /home/app.example.pl/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/app.example.pl/logs/access.log {
  useServer               0
  rollingSize             10M
}

context /.well-known/acme-challenge/ {
  location                /home/app.example.pl/public_html/.well-known/acme-challenge/
  allowBrowse             1
}

context exp:^/\\.(env|git) {
  allowBrowse             0
}

extprocessor node {
  type                    proxy
  address                 127.0.0.1:3007
  maxConns                500
  pcKeepAliveTimeout      3600
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 node
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
RequestHeader unset X-Forwarded-Proto
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}e"
RequestHeader set X-Real-IP "%{REMOTE_ADDR}e"
unset X-Powered-By
END_extraHeaders
}
