<VirtualHost *:80>
    ServerName app.example.pl
    DocumentRoot /home/app.example.pl/public_html
    ErrorLog /home/app.example.pl/logs/error.log
    CustomLog /home/app.example.pl/logs/access.log combined
    ProxyPreserveHost On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3007/
    ProxyPassReverse / http://127.0.0.1:3007/
    RequestHeader set X-Forwarded-Proto "http"
    <FilesMatch "^\.(env|git)">
        Require all denied
    </FilesMatch>
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
</VirtualHost>
