server {
    listen 80;
    listen [::]:80;
    server_name app.example.pl;
    server_tokens off;
    root /home/app.example.pl/public_html;
    access_log /home/app.example.pl/logs/access.log;
    error_log /home/app.example.pl/logs/error.log;
    client_max_body_size 64m;
    location ^~ /.well-known/acme-challenge/ { root /home/app.example.pl/public_html; }
    location ~ /\.(env|git) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
