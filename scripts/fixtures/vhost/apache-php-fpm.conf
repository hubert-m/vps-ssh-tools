<VirtualHost *:80>
    ServerName app.example.pl
    DocumentRoot /home/app.example.pl/public_html
    ErrorLog /home/app.example.pl/logs/error.log
    CustomLog /home/app.example.pl/logs/access.log combined
    DirectoryIndex index.php index.html
    <Directory /home/app.example.pl/public_html>
        Require all granted
        FallbackResource /index.php
    </Directory>
    ProxyPassMatch "^/(.*\.php(/.*)?)$" "unix:/run/php/app.example.pl.sock|fcgi://localhost/home/app.example.pl/public_html"
    <FilesMatch "^\.(env|git)">
        Require all denied
    </FilesMatch>
    Alias /.well-known/acme-challenge/ /home/app.example.pl/public_html/.well-known/acme-challenge/
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
</VirtualHost>
