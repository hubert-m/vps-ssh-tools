server {
    listen 80;
    listen [::]:80;
    server_name app.example.pl;
    server_tokens off;
    root /home/app.example.pl/public_html;
    access_log /home/app.example.pl/logs/access.log;
    error_log /home/app.example.pl/logs/error.log;
    location ^~ /.well-known/acme-challenge/ { root /home/app.example.pl/public_html; }
    location ~ /\.(env|git) { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2)$ { expires 7d; access_log off; }
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
