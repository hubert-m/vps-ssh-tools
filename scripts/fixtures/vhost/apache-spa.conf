<VirtualHost *:80>
    ServerName app.example.pl
    DocumentRoot /home/app.example.pl/public_html
    ErrorLog /home/app.example.pl/logs/error.log
    CustomLog /home/app.example.pl/logs/access.log combined
    FallbackResource /index.html
    Alias /.well-known/acme-challenge/ /home/app.example.pl/public_html/.well-known/acme-challenge/
    <FilesMatch "^\.(env|git)">
        Require all denied
    </FilesMatch>
    Header always set X-Frame-Options SAMEORIGIN
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin
</VirtualHost>
