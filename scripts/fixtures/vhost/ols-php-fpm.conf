docRoot                   /home/app.example.pl/public_html
vhDomain                  app.example.pl
vhAliases                 www.app.example.pl

errorlog /home/app.example.pl/logs/error.log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog /home/app.example.pl/logs/access.log {
  useServer               0
  rollingSize             10M
}

index  {
  useServer               0
  indexFiles              index.php, index.html
}

scripthandler  {
  add                     lsapi:app php
}

context /.well-known/acme-challenge/ {
  location                /home/app.example.pl/public_html/.well-known/acme-challenge/
  allowBrowse             1
}

context exp:^/\\.(env|git) {
  allowBrowse             0
}

extprocessor app {
  type                    lsapi
  address                 /run/php/app.example.pl.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  autoStart               1
  path                    /home/app.example.pl/public_html/../lsphp/bin/lsphp
}
