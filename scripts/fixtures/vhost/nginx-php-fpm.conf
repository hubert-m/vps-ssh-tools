server {
    listen 80;
    listen [::]:80;
    server_name app.example.pl;
    server_tokens off;
    root /home/app.example.pl/public_html;
    index index.php index.html;
    access_log /home/app.example.pl/logs/access.log;
    error_log /home/app.example.pl/logs/error.log;
    client_max_body_size 64m;
    location ^~ /.well-known/acme-challenge/ { root /home/app.example.pl/public_html; }
    location ~ /\.(env|git) { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/app.example.pl.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
